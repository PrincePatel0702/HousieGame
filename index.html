<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Housie Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* Animated Gradient Background */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .game-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            /* Subtle floating animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Range Inputs */
        .range-settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
        }

        .range-settings input {
            width: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .range-settings input:focus {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        /* 3D Sphere Number Display */
        .number-display {
            width: 160px;
            height: 160px;
            margin: 0 auto 2rem auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: 800;
            color: #fff;
            background: radial-gradient(circle at 30% 30%, #ffffff, #6366f1, #312e81);
            box-shadow: 
                0 20px 35px rgba(0, 0, 0, 0.3), 
                inset 0 -10px 20px rgba(0, 0, 0, 0.4),
                inset 0 10px 20px rgba(255, 255, 255, 0.8);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }

        /* Awesome flip and scale animation class */
        .number-display.spin {
            animation: luckySpin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes luckySpin {
            0% { transform: scale(0.5) rotateX(0deg) rotateY(0deg); opacity: 0.5; }
            50% { transform: scale(1.2) rotateX(180deg) rotateY(180deg); opacity: 0.8; }
            100% { transform: scale(1) rotateX(360deg) rotateY(360deg); opacity: 1; }
        }

        /* Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        #generateBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 1.3rem;
            padding: 16px 32px;
        }

        #displayBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        #resetBtn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            width: 60%;
            margin: 0 auto;
        }

        button:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(2px) scale(0.95);
        }

        /* Called Numbers Section */
        .called-numbers-section {
            display: none;
            margin-top: 2rem;
            background: rgba(0,0,0,0.15);
            border-radius: 16px;
            padding: 1.5rem;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Custom Scrollbar for the grid */
        .called-numbers-section::-webkit-scrollbar {
            width: 8px;
        }
        .called-numbers-section::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }

        .called-numbers-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        /* Mini 3D Spheres for History */
        .grid-item {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            background: radial-gradient(circle at 30% 30%, #ffffff, #10b981, #047857);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2), inset 0 -3px 8px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            /* Setup for staggered bounce animation */
            opacity: 0;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3) translateY(30px); }
            50% { transform: scale(1.1) translateY(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Housie Generator</h1>
        
        <!-- Range Settings -->
        <div class="range-settings">
            <label for="minRange">Min</label>
            <input type="number" id="minRange" value="1">
            <label for="maxRange">Max</label>
            <input type="number" id="maxRange" value="90">
        </div>

        <!-- Current Number Display -->
        <div class="number-display" id="currentNumber">
            ??
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="generateBtn">Roll Number 🎲</button>
            <button id="displayBtn">History (<span id="count">0</span>)</button>
            <button id="resetBtn">Restart ↺</button>
        </div>

        <!-- Called Numbers Display -->
        <div class="called-numbers-section" id="calledSection">
            <h3>Drawn Numbers</h3>
            <div class="grid-container" id="numbersGrid">
                <!-- Numbers will be injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        let availableNumbers = []; 
        let drawnNumbers = [];     

        const currentNumberDisplay = document.getElementById('currentNumber');
        const generateBtn = document.getElementById('generateBtn');
        const displayBtn = document.getElementById('displayBtn');
        const resetBtn = document.getElementById('resetBtn');
        const minInput = document.getElementById('minRange');
        const maxInput = document.getElementById('maxRange');
        const calledSection = document.getElementById('calledSection');
        const numbersGrid = document.getElementById('numbersGrid');
        const countDisplay = document.getElementById('count');

        // Initialize Game Array
        function initializeGame() {
            const min = parseInt(minInput.value);
            const max = parseInt(maxInput.value);
            
            if (min >= max) {
                alert("Maximum value must be greater than minimum value.");
                return;
            }

            availableNumbers = [];
            drawnNumbers = [];
            
            for (let i = min; i <= max; i++) {
                availableNumbers.push(i);
            }

            currentNumberDisplay.innerText = "??";
            numbersGrid.innerHTML = "";
            countDisplay.innerText = "0";
            calledSection.style.display = "none";
        }

        // Generate Number with Animations
        generateBtn.addEventListener('click', () => {
            if (availableNumbers.length === 0 && drawnNumbers.length === 0) {
                initializeGame();
            }

            if (availableNumbers.length === 0) {
                alert("All numbers in the range have been generated! Please restart.");
                return;
            }

            // Temporarily disable button to prevent spamming during animation
            generateBtn.disabled = true;
            generateBtn.style.opacity = "0.7";

            // Remove animation class to reset it
            currentNumberDisplay.classList.remove('spin');

            // Pick a number
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const generatedNumber = availableNumbers.splice(randomIndex, 1)[0];
            drawnNumbers.push(generatedNumber);

            // Wait a tiny fraction of a second to re-apply the animation class so it triggers
            setTimeout(() => {
                currentNumberDisplay.innerText = generatedNumber;
                currentNumberDisplay.classList.add('spin');
            }, 10);

            // Re-enable button after animation completes (0.6s)
            setTimeout(() => {
                generateBtn.disabled = false;
                generateBtn.style.opacity = "1";
            }, 600);

            // Update grid count
            countDisplay.innerText = drawnNumbers.length;

            // If history panel is open, add the new number to it smoothly
            if (calledSection.style.display === "block") {
                addSingleNumberToGrid(generatedNumber);
            }
        });

        // Toggle History Panel
        displayBtn.addEventListener('click', () => {
            if (calledSection.style.display === "none" || calledSection.style.display === "") {
                calledSection.style.display = "block";
                renderFullGridStaggered();
            } else {
                calledSection.style.display = "none";
            }
        });

        // Reset Game
        resetBtn.addEventListener('click', initializeGame);

        // Adds a single number to the grid dynamically (used when panel is already open)
        function addSingleNumberToGrid(num) {
            const numElement = document.createElement('div');
            numElement.className = 'grid-item';
            numElement.innerText = num;
            numbersGrid.prepend(numElement); // Add to the top of the grid
        }

        // Renders the whole grid with a staggered delay animation
        function renderFullGridStaggered() {
            numbersGrid.innerHTML = ""; 
            
            // Render backwards so newest is first
            const reversedArray = [...drawnNumbers].reverse();

            reversedArray.forEach((num, index) => {
                const numElement = document.createElement('div');
                numElement.className = 'grid-item';
                numElement.innerText = num;
                // Stagger the animation delay based on index
                numElement.style.animationDelay = `${index * 0.05}s`;
                numbersGrid.appendChild(numElement);
            });
        }

        // Run once on load
        initializeGame();
    </script>
</body>
</html>
